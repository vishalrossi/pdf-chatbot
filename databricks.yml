bundle:
  name: pdf-chatbot

workspace:
  root_path: /vishal/pdf-chatbot

targets:
  dev:
    default: true
    # workspace.host removed; use DATABRICKS_HOST env var

  prod:
    # workspace.host removed; use DATABRICKS_HOST env var

x-libraries: &common-libs
  - pypi:
      package: langchain
  - pypi:
      package: langchain-community
  - pypi:
      package: langchain-text-splitters
  - pypi:
      package: langchain-openai
  - pypi:
      package: databricks-vectorsearch
  - pypi:
      package: pypdf
  - pypi:
      package: databricks-cli
  - pypi:
      package: python-dotenv
  - pypi:
      package: pyyaml
  - pypi:
      package: python-dotenv
  - pypi:
      package: openai
  - pypi:
      package: pyspark
  - pypi:
      package: streamlit
  - pypi:
      package: mlflow[databricks]
  - pypi:
      package: pdfplumber
  - pypi:
      package: deepeval
  - pypi:
      package: regex

resources:
  jobs:
    pdf_ingestion:
      name: vishal-pdf-ingestion-${bundle.target}
      tasks:
        - task_key: ingest_pdf
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          libraries: *common-libs
          spark_python_task:
            python_file: src/ingest_pdf.py

    storage_init:
      name: vishal-storage-init-${bundle.target}
      tasks:
        - task_key: init_storage
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          spark_python_task:
            python_file: src/utils/storage.py

    register_model:
      name: pdf-register-model-${bundle.target}
      tasks:
        - task_key: register_rag_model
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          libraries: *common-libs
          spark_python_task:
            python_file: src/register_model.py

    pdf_chat:
      name: vishal-pdf-chat-${bundle.target}
      tasks:
        - task_key: run_pdf_chat
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          libraries: *common-libs
          spark_python_task:
            python_file: src/chat_pdf_streamlit.py

    evaluate:
      name: vishal-pdf-chat-${bundle.target}
      tasks:
        - task_key: evaluate_llm
          new_cluster:
            spark_version: 14.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
          libraries: *common-libs
          spark_python_task:
            python_file: src/evaluate.py

bundle:
  name: pdf-chatbot

workspace:
  root_path: /vishal/pdf-chatbot

targets:
  dev:
    default: true
    # workspace.host removed; use DATABRICKS_HOST env var

  prod:
    # workspace.host removed; use DATABRICKS_HOST env var

x-libraries: &common-libs
  - pypi:
      package: langchain
  - pypi:
      package: langchain-community
  - pypi:
      package: langchain-text-splitters
  - pypi:
      package: langchain-openai
  - pypi:
      package: databricks-vectorsearch
  - pypi:
      package: pypdf
  - pypi:
      package: databricks-cli
  - pypi:
      package: python-dotenv
  - pypi:
      package: pyyaml
  - pypi:
      package: openai
  - pypi:
      package: pyspark
  - pypi:
      package: streamlit
  - pypi:
      package: mlflow[databricks]
  - pypi:
      package: pdfplumber
  - pypi:
      package: deepeval
  - pypi:
      package: regex

# ---------------------------------------------------------------------
# Reusable YAML anchors
# ---------------------------------------------------------------------

x-spark-version: &spark_version 14.3.x-scala2.12
x-small-node: &small_node Standard_DS3_v2

# ---------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------

resources:
  jobs:

    # ================================================================
    # RAG PIPELINE (end-to-end)
    # ================================================================
    rag_pipeline:
      name: vishal-rag-pipeline-${bundle.target}

      # Shared cluster for sequential tasks
      job_clusters:
        - job_cluster_key: pipeline_cluster
          new_cluster:
            spark_version: *spark_version
            node_type_id: *small_node
            num_workers: 1

      tasks:
        - task_key: storage_init
          job_cluster_key: pipeline_cluster
          spark_python_task:
            python_file: src/utils/storage.py

        - task_key: pdf_ingestion
          depends_on:
            - task_key: storage_init
          job_cluster_key: pipeline_cluster
          libraries: *common-libs
          spark_python_task:
            python_file: src/ingest_pdf.py

        - task_key: get_country_names
          depends_on:
            - task_key: pdf_ingestion
          job_cluster_key: pipeline_cluster
          libraries: *common-libs
          spark_python_task:
            python_file: src/get_names.py

        - task_key: rag and register_model
          depends_on:
            - task_key: get_country_names
          job_cluster_key: pipeline_cluster
          libraries: *common-libs
          spark_python_task:
            python_file: src/register_model.py

        - task_key: evaluate
          depends_on:
            - task_key: register_model
          job_cluster_key: pipeline_cluster
          libraries: *common-libs
          spark_python_task:
            python_file: src/evaluate.py


    # ================================================================
    # PDF CHAT APP (on-demand / interactive)
    # ================================================================
    pdf_chat:
      name: vishal-pdf-chat-${bundle.target}

      tasks:
        - task_key: run_pdf_chat
          new_cluster:
            spark_version: *spark_version
            node_type_id: *small_node
            num_workers: 1
          libraries: *common-libs
          spark_python_task:
            python_file: src/chat_pdf_streamlit.py
